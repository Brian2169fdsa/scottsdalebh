<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="#3A4A5C"/>
  <!-- Shirt / torso -->
  <ellipse cx="100" cy="185" rx="62" ry="42" fill="#5C6A7A"/>
  <rect x="38" y="150" width="124" height="50" fill="#5C6A7A"/>
  <!-- Long hair back layer -->
  <ellipse cx="100" cy="155" rx="46" ry="50" fill="#3D2B1A"/>
  <!-- Neck -->
  <rect x="89" y="130" width="22" height="26" rx="5" fill="#C4956A"/>
  <!-- Head -->
  <ellipse cx="100" cy="106" rx="32" ry="36" fill="#C4956A"/>
  <!-- Hair top -->
  <ellipse cx="100" cy="74" rx="35" ry="22" fill="#3D2B1A"/>
  <ellipse cx="100" cy="68" rx="28" ry="16" fill="#3D2B1A"/>
  <!-- Side hair -->
  <ellipse cx="68" cy="108" rx="12" ry="28" fill="#3D2B1A"/>
  <ellipse cx="132" cy="108" rx="12" ry="28" fill="#3D2B1A"/>
  <!-- Ears -->
  <ellipse cx="68" cy="108" rx="6" ry="8" fill="#B8845C"/>
  <ellipse cx="132" cy="108" rx="6" ry="8" fill="#B8845C"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="104" rx="5" ry="5.5" fill="#2C1A0E"/>
  <ellipse cx="112" cy="104" rx="5" ry="5.5" fill="#2C1A0E"/>
  <circle cx="90" cy="102" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="114" cy="102" r="1.5" fill="#fff" opacity="0.7"/>
  <!-- Eyelashes / lids -->
  <path d="M83 99 Q88 96 93 99" stroke="#2C1A0E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M107 99 Q112 96 117 99" stroke="#2C1A0E" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M98 110 Q96 117 100 119 Q104 117 102 110" stroke="#A8744C" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Mouth / smile -->
  <path d="M90 127 Q100 135 110 127" stroke="#8B4A3A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Earring hint -->
  <circle cx="68" cy="116" r="3" fill="#C9A24B"/>
  <circle cx="132" cy="116" r="3" fill="#C9A24B"/>
</svg>
