<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <circle cx="100" cy="100" r="100" fill="#2C3E30"/>
  <!-- Shirt / torso -->
  <ellipse cx="100" cy="185" rx="62" ry="42" fill="#1E2E22"/>
  <rect x="38" y="148" width="124" height="52" fill="#1E2E22"/>
  <!-- Neck -->
  <rect x="88" y="128" width="24" height="28" rx="5" fill="#A07850"/>
  <!-- Head -->
  <ellipse cx="100" cy="104" rx="33" ry="37" fill="#A07850"/>
  <!-- Hair - short, slightly wavy -->
  <ellipse cx="100" cy="72" rx="33" ry="17" fill="#4A3018"/>
  <rect x="67" y="72" width="66" height="10" fill="#4A3018"/>
  <!-- Slight beard/stubble area -->
  <ellipse cx="100" cy="128" rx="20" ry="8" fill="#8A6540" opacity="0.5"/>
  <!-- Ears -->
  <ellipse cx="67" cy="106" rx="7" ry="9" fill="#906840"/>
  <ellipse cx="133" cy="106" rx="7" ry="9" fill="#906840"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="102" rx="5" ry="5.5" fill="#2C1A0A"/>
  <ellipse cx="112" cy="102" rx="5" ry="5.5" fill="#2C1A0A"/>
  <circle cx="90" cy="100" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="114" cy="100" r="1.5" fill="#fff" opacity="0.7"/>
  <!-- Eyebrows - slightly thicker -->
  <path d="M82 93 Q88 89 95 92" stroke="#3A2410" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M105 92 Q112 89 118 93" stroke="#3A2410" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M97 108 Q95 117 100 119 Q105 117 103 108" stroke="#8A6030" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Mouth / calm smile -->
  <path d="M90 126 Q100 133 110 126" stroke="#6A4020" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
