<!-- @dsCard group="Components" viewport="700x380" name="Brand — Mark, Icon Circle, Notch" subtitle="Logo lockup, outlined gold icon circles, notch transition band." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--navy-900); }
  .pad { padding: 30px 36px; }
  .icons { display: flex; gap: 40px; margin-top: 26px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .lab { font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--white); }
  .lower { background: var(--navy-800); height: 60px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script>
    (function () {
      var injected = 0;
      (function go() {
        if (window.DesignSystem_8429f7) return;
        var s = document.createElement('script');
        s.src = '../../_ds_bundle.js?r=' + Date.now();
        s.onload = function () { if (!window.DesignSystem_8429f7 && injected < 6) setTimeout(go, 150); };
        s.onerror = function () { if (injected++ < 6) setTimeout(go, 200); };
        document.head.appendChild(s);
      })();
      window.dsWhenReady = function (cb) {
        (function p(n) {
          if (window.DesignSystem_8429f7) return cb(window.DesignSystem_8429f7);
          if (n <= 0) { console.error('SBHG: bundle unavailable'); return; }
          setTimeout(function () { p(n - 1); }, 50);
        })(160);
      };
    })();
  </script>
  <script type="text/babel" data-presets="react">
    dsWhenReady(function (DS) {
    const { BadgeMark, IconCircle, NotchBand } = DS;
    const Ico = ({ name }) => <i data-lucide={name} style={{ width: 32, height: 32, strokeWidth: 1.5 }}></i>;
    function Demo() {
      return (
        <div>
          <div className="pad">
            <BadgeMark markSrc="../../assets/badge-mark.png" size={56} />
            <div className="icons">
              <div className="item"><IconCircle><Ico name="shield-check" /></IconCircle><span className="lab">Integrity</span></div>
              <div className="item"><IconCircle><Ico name="heart-handshake" /></IconCircle><span className="lab">Compassion</span></div>
              <div className="item"><IconCircle><Ico name="award" /></IconCircle><span className="lab">Excellence</span></div>
            </div>
          </div>
          <NotchBand height={40} />
          <div className="lower"></div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
    });
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" onload="lucide.createIcons()"></script>
</body>
</html>
